    spec:
      containers:
      - name: ventas-container
        image: 837424058127.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend-ventas:latest
        ports:
        - containerPort: 8092
        resources:
          requests:
            cpu: "100m"
        env:
        - name: DB_ENDPOINT
          value: "innovatech-db.cluster-cm8p0a0vvw12.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "innovatech_db"
        - name: DB_USERNAME
