---
# 1. MICROSERVICIO DE DESPACHOS (Backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: despachos-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: despachos
  template:
    metadata:
      labels:
        app: despachos
    spec:
      containers:
      - name: despachos-container
        image: 837424058127.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend-despachos:latest
        ports:
        - containerPort: 8091
        resources:
          requests:
            cpu: "100m"
        env:
        - name: DB_ENDPOINT
          value: "innovatech-db.cluster-cm8p0a0vvw12.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "innovatech_db"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: despachos-service
spec:
  selector:
    app: despachos
  ports:
    - protocol: TCP
      port: 8091
      targetPort: 8091
  type: ClusterIP # Solo accesible internamente por el clúster

---
# 2. MICROSERVICIO DE VENTAS (Backend)
apiVersion: apps/v1
