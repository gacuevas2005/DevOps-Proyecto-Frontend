name: Deploy Frontend React

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest
          build-args: |
            VITE_API_BASE_URL=http://52.201.210.117

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Descargar la nueva imagen
            docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest
            # Detener el contenedor anterior si existe
            docker stop frontend-app || true
            docker rm frontend-app || true
            # Correr el nuevo contenedor en el puerto 80
            docker run -d --name frontend-app --restart always -p 3000:80 ${{ secrets.DOCKER_USERNAME }}/innovatech-frontend:latest